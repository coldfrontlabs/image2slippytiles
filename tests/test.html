
<html>
    <head>
        <title>Tiling test page</title>
    </head>
    <body>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
   
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

        <style>
            .map {
                height: 500px; width: 500px; 
            }
        </style>
    <div id="map1" class="map""></div>
    <div id="map2" class="map""></div>
    <div id="map3" class="map""></div>
    <div id="map4" class="map""></div>
    <div id="map5" class="map""></div>

    <script>
        var map1 = L.map('map1', {crs: L .CRS.Simple, minZoom: 0, maxZoom: 3}).setView([-20,60], 3);
        L.tileLayer('tmp/1.3.6.1.4.1.36533.16442201611142227222145391901722112346167.dcm/{z}/{x}/{y}.png', { minZoom: 0, maxZoom: 9 }).addTo(map1);

        var map2 = L.map('map2', {crs: L .CRS.Simple, minZoom: 0, maxZoom: 4 }).setView([-20,60], 4);
        L.tileLayer('tmp/CMU-1-Small-Region.svs/{z}/{x}/{y}.png', { minZoom: 0, maxZoom: 9 }).addTo(map2);

        var map3 = L.map('map3', {crs: L .CRS.Simple, minZoom: 0, maxZoom: 3 }).setView([-20,60], 3);
        L.tileLayer('tmp/iss073e0546366~large.jpg/{z}/{x}/{y}.png', { minZoom: 0, maxZoom: 9 }).addTo(map3);

        var map4 = L.map('map4', {crs: L .CRS.Simple, minZoom: 0, maxZoom: 3 }).setView([-20,60], 3);
        L.tileLayer('tmp/iss073e0546366~medium.jpg/{z}/{x}/{y}.png', { minZoom: 0, maxZoom: 9 }).addTo(map4);

        var map5 = L.map('map5', {crs: L .CRS.Simple, minZoom: 0, maxZoom: 6 }).setView([-20,60], 6);
        L.tileLayer('tmp/iss073e0546366~orig.jpg/{z}/{x}/{y}.png', { minZoom: 0, maxZoom: 9 }).addTo(map5);

        var map6 = L.map('map6', {crs: L .CRS.Simple, minZoom: 0, maxZoom: 2 }).setView([-20,60], 2);
        L.tileLayer('tmp/iss073e0546366~small.jpg/{z}/{x}/{y}.png', { minZoom: 0, maxZoom: 9 }).addTo(map6);
    </script>

</body>
</html>
