[package]
name = "image2slippytiles"
version = "1.0.1"
edition = "2021"
license-file = "LICENSE-LGPL"
description = "This program generates image tiles in the slippytile format from giant images and slide scan images such as SVS and DCM."
homepage = "https://github.com/coldfrontlabs/image2slippytiles"
repository =  "https://github.com/coldfrontlabs/image2slippytiles"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::images", "science", "science::bioinformatics", "science::geo"]
keywords = ["images", "slippytiles", "tiles", "openslide", "map"]

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
fast_image_resize = "5.1.1"
hex_color = "3.0.0"
image = "0.25.6"
openslide-rs = "2.3.0"
openslide-sys = "1.0.7"
peak_alloc = "0.3.0"
serde = {version="1.0.217", features=["derive"] }
serde_json = "1.0.135"

[target.x86_64-unknown-linux-gnu]
rustc-link-lib = ["static:openslide"]

[package.metadata.appimage]
auto_link = true

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
lto = true