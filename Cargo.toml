[package]
name = "image2slippytiles"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4.4", features = ["derive"] }
image = "0.25.2"
openslide-rs = "2.2.0"
openslide-sys = "1.0.7"
peak_alloc = "0.2.1"
serde = {version="1.0.215", features=["derive"] }
serde_json = "1.0.132"

[target.x86_64-unknown-linux-gnu]
rustc-link-lib = ["static:openslide"]